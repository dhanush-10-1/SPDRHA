version: '3.9'

services:
  # Zookeeper coordinates Kafka brokers and manages distributed metadata.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: irads-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - irads-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 "]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Kafka broker stores raw anomaly events and exposes them to consumers.
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: irads-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - irads-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    command:
      - bash
      - -c
      - |
        /etc/confluent/docker/run &
        echo "Waiting for Kafka to be ready..."
        until kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1; do
          sleep 2
        done
        kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic ${KAFKA_TOPIC} --partitions 3 --replication-factor 1
        wait

  # PostgreSQL with PostGIS provides the geospatial datastore for raw and confirmed anomaly data.
  postgres:
    image: postgis/postgis:15-3.3
    container_name: irads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - irads-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # pgAdmin is a local browser-based GUI for Postgres inspection and querying during development.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: irads-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - irads-network

  # Redis stores rate-limit counters and geo-index data for alert-related proximity checks.
  redis:
    image: redis:7-alpine
    container_name: irads-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - irads-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Kafka UI is a browser-based tool for browsing topics, partitions, and messages during development.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: irads-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8888:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: irads
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - irads-network

networks:
  irads-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

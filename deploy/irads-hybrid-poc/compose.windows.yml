# Only new POC resources. Do not combine with any existing IRADS Compose file.
name: irads-render-poc
services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: irads_poc
      POSTGRES_USER: irads_poc
      POSTGRES_PASSWORD: ${POC_DB_PASSWORD:?Supply a test-only POC_DB_PASSWORD}
    ports: ["127.0.0.1:15433:5432"]
    volumes:
      - poc_postgres:/var/lib/postgresql/data
      - ./windows/init.sql:/docker-entrypoint-initdb.d/poc.sql:ro
    networks: [poc]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irads_poc -d irads_poc"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    environment:
      POC_REDIS_PASSWORD: ${POC_REDIS_PASSWORD:?Supply a test-only POC_REDIS_PASSWORD}
    command: ["sh", "-ec", 'exec redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction --requirepass "$$POC_REDIS_PASSWORD"']
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["poc_redis:/data"]
    networks: [poc]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$POC_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    volumes:
      - poc_zookeeper_data:/var/lib/zookeeper/data
      - poc_zookeeper_log:/var/lib/zookeeper/log
    networks: [poc]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5"]
      interval: 10s
      timeout: 8s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,RENDER://0.0.0.0:19092
      # RENDER clients must have the matching Render-local TCP forwarder.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,RENDER://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,RENDER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:19092:19092"]
    volumes: ["poc_kafka:/var/lib/kafka/data"]
    networks: [poc]
    restart: unless-stopped
    depends_on:
      zookeeper: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    entrypoint: ["/bin/bash", "-ec"]
    command: ["kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic irads-poc-events --partitions 1 --replication-factor 1"]
    networks: [poc]
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"

  consumer:
    build: ./windows
    environment:
      POC_DB_PASSWORD: ${POC_DB_PASSWORD:?Supply a test-only POC_DB_PASSWORD}
    networks: [poc]
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

networks:
  poc:
    internal: false
volumes:
  poc_postgres:
    name: irads_render_poc_postgres_v1
  poc_redis:
    name: irads_render_poc_redis_v1
  poc_kafka:
    name: irads_render_poc_kafka_v1
  poc_zookeeper_data:
    name: irads_render_poc_zookeeper_data_v1
  poc_zookeeper_log:
    name: irads_render_poc_zookeeper_log_v1
